<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-label="Wiring a Wyze v1 contact to a LaunchPad (LAUNCHXL-CC1310)">
<title>Wiring a Wyze v1 contact to a LaunchPad (LAUNCHXL-CC1310)</title>
<rect width="900" height="545" rx="14" fill="#ffffff"/>
<rect x="40" y="70" width="405" height="282" rx="10" fill="#2d333b"/>
<circle cx="190" cy="176" r="69" fill="none" stroke="#c9a227" stroke-width="10" opacity="0.55"/>
<rect x="115" y="354" width="216" height="12" rx="6" fill="#b6e3e0" opacity="0.8"/>
<text x="223" y="380" text-anchor="middle" font-size="11" fill="#8c959f" font-family="Helvetica, Arial, sans-serif">reed switch (glass, under the board)</text>
<text x="242" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Wyze v1 contact, pad side</text>
<text x="435" y="92" text-anchor="end" font-size="11" fill="#adbac7" font-family="Helvetica, Arial, sans-serif">antenna side →</text>
