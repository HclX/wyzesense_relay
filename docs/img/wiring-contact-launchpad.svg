<text x="137" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">C</text>
<circle cx="209" cy="290" r="11" fill="#d4b483" stroke="#8e44ad" stroke-width="4"/>
<text x="209" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">M</text>
