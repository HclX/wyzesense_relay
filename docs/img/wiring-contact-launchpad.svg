<circle cx="718" cy="159" r="6" fill="#8c959f"/>
<rect x="634" y="150" width="92" height="18" rx="5" fill="#57606a" opacity="0.5"/>
<text x="752" y="164" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">3V3</text>
<path d="M302,270 C472,270 472,159 642,159" fill="none" stroke="#f48fb1" stroke-width="4" stroke-linecap="round"/>
<circle cx="642" cy="193" r="6" fill="#1f2328"/>
<circle cx="718" cy="193" r="6" fill="#8c959f"/>
<text x="752" y="198" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">RXD</text>
<text x="795" y="198" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<path d="M375,295 C509,295 509,193 642,193" fill="none" stroke="#5c7fa8" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="642" cy="227" r="6" fill="#1f2328"/>
<circle cx="718" cy="227" r="6" fill="#8c959f"/>
<text x="752" y="232" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">TXD</text>
<text x="795" y="232" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<path d="M356,325 C499,325 499,227 642,227" fill="none" stroke="#9ccc28" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
<circle cx="642" cy="261" r="6" fill="#1f2328"/>
<circle cx="718" cy="261" r="6" fill="#8c959f"/>
<text x="752" y="266" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">RST</text>
<text x="795" y="266" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<path d="M91,254 C366,254 366,261 642,261" fill="none" stroke="#2e9e3e" stroke-width="4" stroke-linecap="round"/>
<circle cx="642" cy="295" r="6" fill="#1f2328"/>
<circle cx="718" cy="295" r="6" fill="#8c959f"/>
<text x="752" y="300" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">TMS</text>
<text x="795" y="300" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<path d="M209,290 C425,290 425,295 642,295" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linecap="round"/>
<circle cx="642" cy="329" r="6" fill="#1f2328"/>
<circle cx="718" cy="329" r="6" fill="#8c959f"/>
<text x="752" y="334" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">TCK</text>
<text x="795" y="334" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<path d="M137,288 C389,288 389,329 642,329" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
<circle cx="642" cy="363" r="6" fill="#1f2328"/>
<circle cx="718" cy="363" r="6" fill="#8c959f"/>
<text x="752" y="368" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">TDO</text>
<text x="795" y="368" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<circle cx="642" cy="397" r="6" fill="#1f2328"/>
<circle cx="718" cy="397" r="6" fill="#8c959f"/>
<text x="752" y="402" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">TDI</text>
<text x="795" y="402" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<circle cx="642" cy="431" r="6" fill="#1f2328"/>
<circle cx="718" cy="431" r="6" fill="#8c959f"/>
<text x="752" y="436" font-size="13" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">SWO</text>
<text x="795" y="436" font-size="11" fill="#cf222e" font-family="Helvetica, Arial, sans-serif">jumper off</text>
<text x="40" y="505" font-size="12" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Solid: needed (M, C, S, V+, V−). Dashed: optional, the sensor's console (115200 8N1) on the LaunchPad's UART.</text>
<text x="40" y="525" font-size="12" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Wires go to the XDS110 (USB) side. Pull every jumper except GND / 5V / 3V3, so the LaunchPad's own chip is off the lines. Battery out.</text>
</svg>
