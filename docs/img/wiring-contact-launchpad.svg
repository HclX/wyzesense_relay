<text x="680" y="36" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">LAUNCHXL-CC1310 jumper block</text>
<text x="680" y="54" text-anchor="middle" font-size="11" fill="#8c959f" font-family="Helvetica, Arial, sans-serif">(turned on its side for the drawing)</text>
