<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" role="img" aria-label="Wiring a Wyze v1 contact to an Classic ESP32 (LOLIN32) relay">
<title>Wiring a Wyze v1 contact to an Classic ESP32 (LOLIN32) relay</title>
<rect width="900" height="485" rx="14" fill="#ffffff"/>
<rect x="40" y="70" width="405" height="282" rx="10" fill="#2d333b"/>
<circle cx="190" cy="176" r="69" fill="none" stroke="#c9a227" stroke-width="10" opacity="0.55"/>
<rect x="115" y="354" width="216" height="12" rx="6" fill="#b6e3e0" opacity="0.8"/>
<text x="223" y="380" text-anchor="middle" font-size="11" fill="#8c959f" font-family="Helvetica, Arial, sans-serif">reed switch (glass, under the board)</text>
<text x="242" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Wyze v1 contact, pad side</text>
<text x="435" y="92" text-anchor="end" font-size="11" fill="#adbac7" font-family="Helvetica, Arial, sans-serif">antenna side →</text>
<circle cx="176" cy="112" r="11" fill="#d4b483" stroke="#8e1b1b" stroke-width="4"/>
<text x="176" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">V− (GND)</text>
<circle cx="91" cy="254" r="11" fill="#d4b483" stroke="#2e9e3e" stroke-width="4"/>
<text x="91" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">S</text>
<circle cx="137" cy="288" r="11" fill="#d4b483" stroke="#e53935" stroke-width="4"/>
<text x="137" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">C</text>
<circle cx="209" cy="290" r="11" fill="#d4b483" stroke="#8e44ad" stroke-width="4"/>
<text x="209" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">M</text>
<circle cx="302" cy="270" r="11" fill="#d4b483" stroke="#f48fb1" stroke-width="4"/>
<text x="302" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">V+ (3.3 V)</text>
<circle cx="375" cy="295" r="11" fill="#d4b483" stroke="#5c7fa8" stroke-width="4"/>
<text x="375" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">R</text>
<circle cx="356" cy="325" r="11" fill="#d4b483" stroke="#9ccc28" stroke-width="4"/>
<text x="356" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">T</text>
<rect x="620" y="30" width="245" height="378" rx="10" fill="#1b4f72"/>
<text x="742" y="54" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">Classic ESP32 (LOLIN32)</text>
<text x="742" y="400" text-anchor="middle" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">relay image ows-relay-esp32-*</text>
<path d="M176,112 C405,112 405,92 634,92" fill="none" stroke="#8e1b1b" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="92" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="97" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GND</text>
<path d="M91,254 C362,254 362,136 634,136" fill="none" stroke="#2e9e3e" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="136" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="141" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">4</text>
<text x="722" y="141" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">reset (opt. w/ GPIO27)</text>
<path d="M302,270 C468,270 468,180 634,180" fill="none" stroke="#f48fb1" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="180" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="185" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">GPIO27</text>
<text x="722" y="185" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">or 3V</text>
<path d="M137,288 C385,288 385,224 634,224" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="224" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="229" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">26</text>
<text x="722" y="229" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">cJTAG TCKC</text>
<path d="M209,290 C421,290 421,268 634,268" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="268" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="273" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">25</text>
<text x="722" y="273" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">cJTAG TMSC</text>
<path d="M375,295 C505,295 505,312 634,312" fill="none" stroke="#5c7fa8" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="312" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="317" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">17</text>
<text x="722" y="317" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">UART1 TX</text>
<path d="M356,325 C495,325 495,356 634,356" fill="none" stroke="#9ccc28" stroke-width="4" stroke-linecap="round"/>
<circle cx="634" cy="356" r="7" fill="#d4b483" stroke="#ffffff" stroke-width="2"/>
<text x="650" y="361" font-size="14" font-weight="bold" fill="#ffffff" font-family="Helvetica, Arial, sans-serif">18</text>
<text x="722" y="361" font-size="11" fill="#d0d7de" font-family="Helvetica, Arial, sans-serif">UART1 RX</text>
<text x="40" y="445" font-size="12" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Seven wires (M/C recommended for cJTAG; S optional when + is on GPIO7/GPIO27). R is contact RX, T is TX.</text>
<text x="40" y="465" font-size="12" fill="#1f2328" font-family="Helvetica, Arial, sans-serif">Battery out; keep 20–30 cm of wire with the contact antenna pointing away from the ESP.</text>
</svg>
