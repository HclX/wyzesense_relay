; The ESP8266 relay (issue #22): the same cores as the ESP32-S3 firmware (relay/: the relay and the outage
; buffer), in an Arduino shell. Build: tools/pio.sh run (PlatformIO pinned there; the platform pinned here).
[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
extra_scripts = pre:embed.py  ; the shared web page, the gateway image it carries (#76), its version
lib_deps = ows_core  ; lib/ows_core: its sources are the shared cores (found through library.json, not by headers)
build_flags =
    -I${PROJECT_DIR}/../relay
    -I${PROJECT_DIR}/../contact
    -I${PROJECT_DIR}/../web
    -I${PROJECT_DIR}/../common
    -DOWS_CONTACT_RESET=4   ; D2: its S pad (RESET_N), open-drain
    -DOWS_BOARD=\"${this.board}\"
    -Wall -Wextra -Werror
monitor_speed = 115200
