[env:d1_mini]
;Pinned platform release for reproducible ESP8266 builds (NodeMCU / Wemos D1 mini, 4 MB flash).
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
;2 MB sketch / 2 MB OTA slot (no filesystem needed: web UI is embedded in PROGMEM)
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
extra_scripts = pre:embed.py
build_flags =
    -Wall
    -Wextra
    -I${PROJECT_DIR}/../common
    -I${PROJECT_DIR}/../relay
    -I${PROJECT_DIR}/../contact
    -I${PROJECT_DIR}/../web
    -I${PROJECT_DIR}/../rig
