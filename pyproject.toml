[project]
name = "wyzesense-relay"
version = "0.1.0"
description = "ESP32 and ESP8266 IP relay and provisioning station for Wyze Sense"
requires-python = ">=3.10"
dependencies = ["pycryptodome>=3.20", "numpy>=1.26"]

[dependency-groups]
dev = [
    "clang-format>=23.1.3",
    "clang-tidy>=23.1.3",
    "pytest>=8",
    "ruff>=0.17.2",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tools", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".toolchain", "build", "idf/build", "idf/build-esp32", "esp8266/.pio"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM"]
